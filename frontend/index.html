<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智汇知识库 · RAG Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 主题预置：避免刷新闪烁
      (function () {
        var t = localStorage.getItem("kb-theme") || "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — Codex-style Modern Minimal (brief-pinned by user; code-led)
      THESIS: Codex 式现代极简的企业 RAG 工作台——单色墨阶、无衬线、圆角卡片、克制动效；
              拒绝报纸拟物与通用渐变仪表盘两种套路，信任留白与制表数字。
      OWN-WORLD: 近白/近黑双主题（#FFFFFF / #212121 地，#F9F9F9 / #2A2A2A 面，
              墨色主按钮 #0D0D0D / #FFFFFF），Inter + 系统中文黑体；数据一律等宽制表数字；
              10–14px 圆角、发丝边框、无装饰阴影；语义色仅三枚状态点与 #10A37F 数据线。
      STORY: 用户在安静的工作台里完成 入库→提问→评估→看板→配置；质量以数字与状态点说话。
      FIRST VIEWPORT: 左侧 240px 侧栏（品牌、五项导航、模式状态与主题切换），
              主区留白居中内容列；问答页为居中对话列 + 底部圆角输入卡，发送键为墨色圆钮。
      FORM: brief-pinned（用户指定仿 Codex；用户钉定的方向优先于概念掷骰）。
      FINISH: unreviewed and undocumented is unfinished; this build ends with
              the finish review, the verdict, DESIGN.md, and every shipping
              raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
